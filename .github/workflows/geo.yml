name: geo-watch

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごとに起動（中で1分おきに9分間チェック）
  workflow_dispatch:

concurrency:
  group: geo-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check GEO outlet
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.GEO_DISCORD_WEBHOOK_URL }}
          GEO_KEYWORDS: ""        # 例: "iPhone 13,Pixel 8"（空なら全機種）
          LOOP_MINUTES: "9"
          INTERVAL_SEC: "60"
        run: python geo.py
      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add geo_state.json
          git diff --cached --quiet || (git commit -m "update geo state" && git pull --rebase && git push)
